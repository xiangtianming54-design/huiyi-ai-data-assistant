spring:
  application:
    name: huiyi-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

huiyi:
  knowledge:
    backfill-vector-space-ids: ${HUIYI_KNOWLEDGE_BACKFILL_VECTOR_SPACE_IDS:true}

# 日志
logging:
  level:
    root: info
    com.huiyi.assistant: debug
