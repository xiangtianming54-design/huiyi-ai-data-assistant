name: 功能建议
description: 新能力或行为变更（需对照路线图版本）
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先看 [docs/roadmap.md](../docs/roadmap.md)。版本顺序以企业迭代文档为准；v0.6.1 不加用户体系或 Agent。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议做法
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: 建议放入的版本
      options:
        - v0.6.1 Baseline Hardening
        - v0.7.0 Enterprise Foundation
        - v0.8.0 Observability & Cost
        - v0.9.0 Tool Harness & Agent Runtime
        - v1.0.0 Stable Agent Assistant
        - v1.1.0 Eval & Prompt Governance
        - v1.2.0 Enterprise Knowledge Plane
        - v1.3.0 Production Ready
        - v1.4.0+ Platform
        - 不确定
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 明确不做
      description: 避免范围膨胀。
