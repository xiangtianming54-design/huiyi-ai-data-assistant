# HuiYi AI Data Assistant 一键编排
# 使用：cp .env.example .env 并填入 LLM 相关配置后，docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: huiyi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: huiyi_demo
      TZ: Asia/Shanghai
    ports:
      # 宿主机端口可通过 .env 的 MYSQL_HOST_PORT 覆盖（默认 3307，规避本机 MySQL 的 3306）
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init_mysql.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./scripts/init_sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - huiyi-net

  redis:
    image: redis:7
    container_name: huiyi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - huiyi-net

  python-service:
    build:
      context: ./python-service
      extra_hosts:
        - "mirrors.cloud.tencent.com:${TENCENT_MAVEN_IP:-123.6.105.104}"
    container_name: huiyi-python
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_store
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - chroma-data:/app/chroma_store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - huiyi-net

  backend:
    build:
      context: ./backend
      extra_hosts:
        # Docker Desktop 的 192.168.65.7 DNS 代理会间歇失败；构建时用宿主机解析到的 IPv4。
        - "mirrors.cloud.tencent.com:${TENCENT_MAVEN_IP:-123.6.105.104}"
    container_name: huiyi-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/huiyi_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_SERVICE_URL: http://python-service:8001
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-true}
      DEFAULT_MEMBER_ROLE: ${DEFAULT_MEMBER_ROLE:-VIEWER}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-huiyi}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-huiyi-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1800}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-604800}
      LOGIN_FAIL_MAX_ATTEMPTS: ${LOGIN_FAIL_MAX_ATTEMPTS:-5}
      LOGIN_FAIL_WINDOW_SECONDS: ${LOGIN_FAIL_WINDOW_SECONDS:-900}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      LLM_COST_ENABLED: ${LLM_COST_ENABLED:-true}
      LLM_COST_DEFAULT: ${LLM_COST_DEFAULT:-0}
      TRACE_STEPS_ENABLED: ${TRACE_STEPS_ENABLED:-true}
      TRACE_MAX_STEPS: ${TRACE_MAX_STEPS:-20}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - huiyi-net

  # ===== 前端（Vue3 构建产物 + nginx 托管，/api 反代到 backend） =====
  frontend:
    build: ./frontend
    container_name: huiyi-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - huiyi-net

volumes:
  mysql-data:
  redis-data:
  chroma-data:

networks:
  huiyi-net:
    driver: bridge
