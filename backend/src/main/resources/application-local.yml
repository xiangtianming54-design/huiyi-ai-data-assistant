# 本地开发环境：基础设施（MySQL/Redis）由 docker compose 提供，Java/Python 在本机运行
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    # 容器 MySQL 映射到宿主机 3307（规避本机 MySQL 占用的 3306）
    url: ${DB_URL:jdbc:mysql://localhost:3307/huiyi_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:huiyi123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

huiyi:
  agent:
    run-timeout-ms: ${HUIYI_AGENT_RUN_TIMEOUT_MS:90000}
    prompt-max-chars: ${HUIYI_AGENT_PROMPT_MAX_CHARS:24000}
  auth:
    register-enabled: ${REGISTER_ENABLED:true}
    default-member-role: ${DEFAULT_MEMBER_ROLE:VIEWER}
    default-workspace-code: ${DEFAULT_WORKSPACE_CODE:default}
    jwt-secret: ${JWT_SECRET:local-dev-only-change-me-32chars-min}
    jwt-issuer: ${JWT_ISSUER:huiyi}
    jwt-audience: ${JWT_AUDIENCE:huiyi-api}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL:1800}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL:604800}
    login-fail-max-attempts: ${LOGIN_FAIL_MAX_ATTEMPTS:5}
    login-fail-window-seconds: ${LOGIN_FAIL_WINDOW_SECONDS:900}
    login-lock-seconds: ${LOGIN_LOCK_SECONDS:900}
  observability:
    enabled: ${OBSERVABILITY_ENABLED:true}
    metrics-enabled: ${METRICS_ENABLED:true}
    llm-cost-enabled: ${LLM_COST_ENABLED:true}
    llm-cost-default: ${LLM_COST_DEFAULT:0}
    trace-steps-enabled: ${TRACE_STEPS_ENABLED:true}
    trace-max-steps: ${TRACE_MAX_STEPS:20}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

# Python Sidecar 服务地址
python-service:
  url: ${PYTHON_SERVICE_URL:http://localhost:8001}

# 意图识别（v0.4 混合分层：rule=纯规则；hybrid=规则→embedding→LLM 三层）
app:
  intent:
    mode: hybrid
    strong-keywords: 排名,销售额,订单量,趋势,最高,最低,对比,占比,汇总,统计,top,TOP,Top,删除,修改,更新,清空
    weak-keywords: 多少,几个,哪家
    business-nouns: 订单,销售,商品,产品,渠道,客户,收入,销量,金额
    knowledge-keywords: 什么是,是什么,定义,口径,什么意思,有哪些,包含哪些
    embedding-threshold: 0.55
  sql:
    allowed-tables: sales_orders,products,regions,channels
    ro-url: ${RO_DB_URL:jdbc:mysql://localhost:3307/huiyi_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    ro-username: ${RO_DB_USERNAME:huiyi_ro}
    ro-password: ${RO_DB_PASSWORD:huiyi_ro123}

# LLM OpenAI 兼容 API（密钥一律走环境变量，禁止硬编码）
llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  embedding-model: ${LLM_EMBEDDING_MODEL:}
